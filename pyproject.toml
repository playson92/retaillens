[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retaillens"
version = "0.1.0"
description = "RetailLens marketplace analytics project built from the portfolio template."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "Jonatan Tomaszewicz" }
]
keywords = [
    "portfolio",
    "data-analytics",
    "python",
    "sql"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
dependencies = ["psycopg[binary]==3.2.13", "python-dotenv==1.2.1"]

[project.scripts]
retaillens = "retaillens.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.0",
    "jsonschema==4.26.0"
]

data = ["kagglehub==1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers"
]
markers = ["integration: requires a real PostgreSQL database"]

[tool.setuptools.data-files]
"share/retaillens/sql" = ["sql/*.sql"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "data",
    ".venv"
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
